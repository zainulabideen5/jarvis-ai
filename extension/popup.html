<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JARVIS Bridge</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { font-size: 14px; margin: 0 0 10px; color: #f1f5f9; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 12px; }
    .row:last-child { border-bottom: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .ok { background: #10b981; }
    .err { background: #ef4444; }
    .warn { background: #f59e0b; }
    .muted { color: #94a3b8; }
    button {
      background: #3b82f6; color: white; border: none; padding: 6px 10px;
      border-radius: 4px; font-size: 11px; cursor: pointer; width: 100%;
      margin-top: 10px;
    }
    button:hover { background: #2563eb; }
    code { background: #1e293b; padding: 2px 5px; border-radius: 3px; font-size: 10px; }
  </style>
</head>
<body>
  <h1>🤖 JARVIS Bridge</h1>
  <div class="row">
    <span>Connection</span>
    <span id="conn"><span class="dot warn"></span>connecting...</span>
  </div>
  <div class="row">
    <span>Server</span>
    <span class="muted"><code>ws://127.0.0.1:8000</code></span>
  </div>
  <div class="row">
    <span>Last update</span>
    <span class="muted" id="last">—</span>
  </div>
  <button id="reload">Reconnect</button>
  <div style="font-size: 10px; color: #64748b; margin-top: 10px; line-height: 1.4;">
    Server chal raha hona chahiye port 8000 pe.
    Yeh extension regular Chrome mein chal sakti — JARVIS work
    background tabs mein hota, tumhare tabs touched nahi.
  </div>

  <script src="popup.js"></script>
</body>
</html>
